<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YoSOM — Student Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #FAF7F2;
    --cream-2: #F2EDE4;
    --ink: #1B2845;
    --ink-soft: #2A3759;
    --coral: #FF6B6B;
    --coral-deep: #E85959;
    --yale: #0F4D92;
    --muted: #8A8A93;
    --line: rgba(27, 40, 69, 0.08);
  }
  html, body { margin: 0; padding: 0; background: #0a0a0c; }
  body {
    font-family: -apple-system, "SF Pro Text", "SF Pro Display", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  * { box-sizing: border-box; }

  /* hide scrollbars in chat */
  .yo-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .yo-scroll { scrollbar-width: none; }

  @keyframes yo-pop-in {
    0%   { opacity: 0; transform: translateY(10px) scale(0.96); }
    60%  { opacity: 1; transform: translateY(-2px) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .yo-pop { animation: yo-pop-in 360ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }

  @keyframes yo-fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .yo-fade-up { animation: yo-fade-up 320ms ease-out both; }

  @keyframes yo-typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-3px); opacity: 1; }
  }
  .yo-dot { animation: yo-typing 1.2s ease-in-out infinite; }
  .yo-dot:nth-child(2) { animation-delay: 0.15s; }
  .yo-dot:nth-child(3) { animation-delay: 0.30s; }

  @keyframes yo-heart-burst {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .yo-heart-burst { animation: yo-heart-burst 380ms cubic-bezier(0.3, 1.4, 0.5, 1) both; }

  @keyframes yo-bar-grow {
    from { width: 0%; }
  }
  .yo-bar { animation: yo-bar-grow 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  @keyframes yo-pulse-dot {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  .yo-pulse { animation: yo-pulse-dot 1.6s ease-in-out infinite; }

  /* press-down for tappable cards */
  .yo-tap { transition: transform 120ms ease, box-shadow 200ms ease, background 200ms ease; }
  .yo-tap:active { transform: scale(0.97); }

  /* floating chips */
  .yo-chip {
    transition: transform 120ms ease, background 160ms ease, color 160ms ease, border-color 160ms ease;
  }
  .yo-chip:active { transform: scale(0.95); }

  /* word cloud floating */
  @keyframes yo-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .yo-float { animation: yo-float 3s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="yosom/icons.jsx"></script>
<script type="text/babel" src="yosom/cards.jsx"></script>
<script type="text/babel" src="yosom/livefeed.jsx"></script>
<script type="text/babel" src="yosom/chat.jsx"></script>
<script type="text/babel" src="yosom/app.jsx"></script>

</body>
</html>
